[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "openterminal-quant"
version = "0.1.0"
description = "Research-only quantitative analysis service for OpenTerminal and IBKR"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1",
    "ib_async>=2.0,<3",
    "numpy>=2.0,<3",
    "pandas>=2.2,<4",
    "pydantic>=2.10,<3",
    "pydantic-settings>=2.7,<3",
    "uvicorn[standard]>=0.34,<1",
    "httpx>=0.28,<1",
]

[project.optional-dependencies]
test = [
    "pytest>=8.3,<9",
    "pytest-asyncio>=0.25,<2",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["quant_engine*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
